<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f1ee" />
    <title>Nina D’luxe — Perfumes árabes</title>
    <meta
      name="description"
      content="Nina D’luxe: perfumes árabes com entrega. Consulte disponibilidade e faça seu pedido pelo WhatsApp."
    />
    <meta property="og:title" content="Nina D’luxe — Perfumes árabes" />
    <meta
      property="og:description"
      content="Perfumes árabes com entrega. Consulte e peça pelo WhatsApp."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://tiagofalavinha-boop.github.io/nina-dluxe/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tiagofalavinha-boop.github.io/nina-dluxe/og-image.jpg" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="estilo.css?v=3" />
  </head>
  <body>
    <div class="bg-ornament" aria-hidden="true"></div>

    <header class="cabecalho">
      <p class="cabecalho__selo">Perfumes árabes · Entrega</p>
      <h1 class="cabecalho__marca">
        <img
          class="cabecalho__logo"
          src="logo.webp"
          width="900"
          height="542"
          alt="Nina D’luxe"
        />
      </h1>
      <p class="cabecalho__subtitulo">
        Uma seleção de perfumes árabes para pedir com conforto, direto no WhatsApp.
      </p>
    </header>

    <main>
      <section class="controles" aria-label="Busca e filtros">
        <div class="controles__inner">
          <div class="controles__topo">
            <label class="busca">
              <span class="visually-hidden">Pesquisar pelo nome do produto</span>
              <svg class="busca__icone" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.6" />
                <path d="M20 20 L16.2 16.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
              <input
                id="busca"
                type="search"
                placeholder="Buscar pelo nome do perfume…"
                autocomplete="off"
                spellcheck="false"
              />
            </label>
            <div class="vista" role="group" aria-label="Como ver os produtos">
              <button type="button" class="vista__botao is-ativo" data-vista="grade" aria-pressed="true" title="Grade" aria-label="Ver em grade">
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="currentColor">
                  <rect x="3" y="3" width="8" height="8" rx="1.5"/>
                  <rect x="13" y="3" width="8" height="8" rx="1.5"/>
                  <rect x="3" y="13" width="8" height="8" rx="1.5"/>
                  <rect x="13" y="13" width="8" height="8" rx="1.5"/>
                </svg>
              </button>
              <button type="button" class="vista__botao" data-vista="lista" aria-pressed="false" title="Lista" aria-label="Ver em lista">
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="currentColor">
                  <rect x="3" y="4" width="4" height="4" rx="0.8"/>
                  <rect x="9" y="5" width="12" height="2" rx="1"/>
                  <rect x="3" y="10" width="4" height="4" rx="0.8"/>
                  <rect x="9" y="11" width="12" height="2" rx="1"/>
                  <rect x="3" y="16" width="4" height="4" rx="0.8"/>
                  <rect x="9" y="17" width="12" height="2" rx="1"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="filtros" id="filtros-marcas" hidden>
            <p class="filtros__rotulo">Marca</p>
            <div class="filtros__lista" id="lista-marcas" role="tablist" aria-label="Filtrar por marca"></div>
          </div>
        </div>
      </section>

      <p class="resultado" id="resultado" aria-live="polite"></p>

      <section class="grade" id="grade" aria-label="Produtos"></section>

      <p class="vazio" id="vazio" hidden>
        Nenhum perfume encontrado com essa busca. Tente outro nome ou fale conosco no WhatsApp.
      </p>
    </main>

    <footer class="rodape">
      <p class="rodape__marca">Nina D’luxe</p>
      <p class="rodape__texto">
        Perfumes árabes com <strong>entrega</strong>. Dúvidas ou pedidos? Chame no WhatsApp.
      </p>
      <a class="rodape__whatsapp" id="rodape-whatsapp" target="_blank" rel="noopener noreferrer">
        Falar no WhatsApp
      </a>
    </footer>

    <a
      class="whatsapp-flutuante"
      id="whatsapp-flutuante"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Falar no WhatsApp"
    >
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <path
          fill="currentColor"
          d="M19.05 4.91A9.82 9.82 0 0 0 12.04 2C6.5 2 2.02 6.48 2.02 12c0 1.77.46 3.45 1.28 4.91L2 22l5.25-1.38A9.9 9.9 0 0 0 12.04 22c5.52 0 10.02-4.48 10.02-10 0-2.65-1.05-5.15-2.99-7.09ZM12.04 20.15a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.18 8.18 0 0 1-1.26-4.29c0-4.54 3.7-8.23 8.23-8.23 2.2 0 4.26.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.81c0 4.54-3.7 8.15-8.23 8.15Zm4.52-6.13c-.25-.12-1.47-.72-1.7-.81-.22-.08-.39-.12-.55.12-.16.25-.63.8-.77.97-.14.16-.28.18-.53.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.28.37-.42.12-.14.16-.25.25-.41.08-.16.04-.31-.02-.43-.06-.12-.55-1.33-.75-1.82-.2-.48-.4-.41-.55-.42h-.47c-.16 0-.43.06-.65.31-.22.25-.86.84-.86 2.05s.88 2.38 1 2.54c.12.16 1.77 2.7 4.29 3.79.6.26 1.07.41 1.44.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.10-.22-.16-.47-.28Z"
        />
      </svg>
    </a>

    <noscript>
      <p class="noscript">
        Este site precisa do JavaScript ligado para mostrar os produtos. Você também pode nos chamar no WhatsApp.
      </p>
    </noscript>

    <script src="config.js"></script>
    <script src="app.js?v=3" defer></script>
  </body>
</html>
